name: verify-and-publish

# Verifies every release folder (release/<tag>/) and, ONLY when a release tag (pi-v* or updater-v*) is pushed, publishes it as a GitHub
# release. Pushes to main and to ci/* branches and pull requests only VERIFY. Nothing here can sign anything: the package arrives already
# signed (offline), and this workflow only checks that a camera would accept it, then uploads exactly two files.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['pi-v*', 'updater-v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install the one dependency
        run: python -m pip install --disable-pip-version-check cryptography==43.0.3
      - name: Self tests of the verifier
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: A release tag must point at a commit that is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify the release folder(s)
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test -d "release/${GITHUB_REF_NAME}" || { echo "no folder release/${GITHUB_REF_NAME} in this commit"; exit 1; }
            python scripts/verify_release.py "release/${GITHUB_REF_NAME}" --trust trust
          else
            found=0
            for d in release/*/; do
              [ -d "$d" ] || continue
              found=1
              python scripts/verify_release.py "${d%/}" --trust trust
            done
            [ "$found" = 1 ] || echo "no release folders: nothing to verify"
          fi

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'klick-rw/presenceeye-camera-releases'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install the one dependency
        run: python -m pip install --disable-pip-version-check cryptography==43.0.3
      - name: Publish exactly the package and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          D="release/${TAG}"
          INFO="$(python scripts/verify_release.py "$D" --trust trust)"
          PRE="$(python -c 'import json,sys; print("--prerelease" if json.loads(sys.argv[1])["prerelease"] else "")' "$INFO")"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists: refusing to touch it"; exit 1; fi
          gh release create "$TAG" "$D/${TAG}.peye" "$D/SHA256SUMS" --verify-tag --title "$TAG" $PRE \
            --notes "Signed PresenceEye update package. Verify the download with: sha256sum -c SHA256SUMS. Cameras verify the signature themselves before installing."
          echo "published $TAG"
